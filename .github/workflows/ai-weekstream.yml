name: CGI AI Retail & Consumer Services Weekstream

on:
  workflow_dispatch:
  schedule:
    # Elke vrijdag om 07:30 Europe/Amsterdam.
    - cron: "30 7 * * 5"
      timezone: Europe/Amsterdam

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Genereer CGI AI & Retail weekstream
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime as dt
          import email.utils
          import hashlib
          import html
          import json
          import os
          import re
          import textwrap
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path
          try:
              from zoneinfo import ZoneInfo
          except Exception:
              ZoneInfo = None

          TZ = ZoneInfo("Europe/Amsterdam") if ZoneInfo else dt.timezone.utc
          NOW = dt.datetime.now(TZ)
          CUTOFF = NOW - dt.timedelta(days=7)
          SITE = Path("site")
          LATEST = SITE / "latest"
          WEEK_ID = f"{NOW.isocalendar().year}-W{NOW.isocalendar().week:02d}"
          ARCHIVE = SITE / "content_streams" / WEEK_ID
          LATEST.mkdir(parents=True, exist_ok=True)
          ARCHIVE.mkdir(parents=True, exist_ok=True)

          SOURCES = [
              # International AI news and model/research sources
              {"name":"TechCrunch AI", "url":"https://techcrunch.com/category/artificial-intelligence/feed/", "kind":"ai_news"},
              {"name":"The Verge AI", "url":"https://www.theverge.com/rss/ai-artificial-intelligence/index.xml", "kind":"ai_news"},
              {"name":"WIRED AI", "url":"https://www.wired.com/feed/tag/artificial-intelligence/latest/rss", "kind":"ai_news"},
              {"name":"VentureBeat AI", "url":"https://venturebeat.com/category/ai/feed/", "kind":"ai_news"},
              {"name":"The Decoder", "url":"https://the-decoder.com/feed/", "kind":"ai_news"},
              {"name":"MIT News AI", "url":"https://news.mit.edu/rss/topic/artificial-intelligence2", "kind":"research"},
              {"name":"OpenAI News", "url":"https://openai.com/news/rss.xml", "kind":"official_lab"},
              {"name":"Google DeepMind Blog", "url":"https://deepmind.google/discover/blog/rss.xml", "kind":"official_lab"},
              {"name":"Anthropic News", "url":"https://www.anthropic.com/news/rss.xml", "kind":"official_lab"},
              {"name":"Hugging Face Papers", "url":"https://huggingface.co/papers/rss", "kind":"research"},
              {"name":"NVIDIA Blog", "url":"https://blogs.nvidia.com/feed/", "kind":"platform"},
              {"name":"Microsoft AI Blog", "url":"https://blogs.microsoft.com/ai/feed/", "kind":"platform"},
              # Retail & Consumer Services sources
              {"name":"Retail Dive", "url":"https://www.retaildive.com/feeds/news/", "kind":"retail"},
              {"name":"Modern Retail", "url":"https://www.modernretail.co/feed/", "kind":"retail"},
              {"name":"RetailWire", "url":"https://retailwire.com/feed/", "kind":"retail"},
              {"name":"Grocery Dive", "url":"https://www.grocerydive.com/feeds/news/", "kind":"retail"},
              {"name":"Retail TouchPoints", "url":"https://www.retailtouchpoints.com/feed", "kind":"retail"},
              {"name":"Digital Commerce 360", "url":"https://www.digitalcommerce360.com/feed/", "kind":"retail"},
              {"name":"NRF", "url":"https://nrf.com/rss.xml", "kind":"retail"},
          ]

          AI_TERMS = [
              "ai", "artificial intelligence", "generative ai", "genai", "machine learning", "ml", "llm", "large language",
              "foundation model", "model", "chatgpt", "openai", "claude", "anthropic", "gemini", "deepmind",
              "copilot", "agent", "agents", "assistant", "automation", "autonomous", "multimodal", "inference",
              "training", "synthetic data", "robot", "robotics", "computer vision", "voice ai", "reasoning"
          ]
          RETAIL_TERMS = [
              "retail", "retailer", "consumer", "customer", "shopper", "shopping", "ecommerce", "e-commerce", "commerce",
              "omnichannel", "store", "stores", "grocery", "fashion", "marketplace", "loyalty", "personalization",
              "personalisation", "checkout", "pos", "inventory", "supply chain", "forecast", "forecasting", "warehouse",
              "fulfillment", "fulfilment", "pricing", "promotion", "merchandising", "assortment", "qsr", "hospitality"
          ]
          TECH_TERMS = [
              "data", "platform", "cloud", "api", "software", "digital", "analytics", "automation", "cyber", "security",
              "privacy", "governance", "crm", "erp", "commerce platform", "search", "recommendation", "recommendations"
          ]

          TOPIC_RULES = [
              ("Retail & Consumer Services", ["retail", "retailer", "consumer", "shopper", "store", "grocery", "commerce", "ecommerce", "e-commerce", "marketplace", "qsr", "hospitality"]),
              ("AI Agents & Automation", ["agent", "agents", "assistant", "autonomous", "workflow", "automation", "copilot"]),
              ("GenAI & Foundation Models", ["generative ai", "genai", "llm", "large language", "foundation model", "model", "chatgpt", "claude", "gemini", "openai", "anthropic", "deepmind"]),
              ("Customer & Loyalty", ["customer", "loyalty", "personalization", "personalisation", "marketing", "experience", "shopper", "recommendation"]),
              ("Store Operations", ["store", "checkout", "pos", "associate", "workforce", "cashier", "queue", "loss prevention", "shrink"]),
              ("Supply Chain & Forecasting", ["inventory", "supply chain", "forecast", "forecasting", "warehouse", "fulfillment", "fulfilment", "demand planning"]),
              ("Pricing & Merchandising", ["pricing", "promotion", "promo", "merchandising", "assortment", "markdown", "demand"]),
              ("Data, Platforms & Cloud", ["data", "platform", "cloud", "api", "infrastructure", "gpu", "nvidia", "microsoft", "azure", "database"]),
              ("Governance, Risk & Responsible AI", ["governance", "risk", "responsible", "safety", "security", "privacy", "regulation", "policy", "eu ai act", "compliance", "copyright"]),
              ("Research & Market Signals", ["research", "paper", "benchmark", "report", "study", "funding", "investment", "startup", "acquisition", "market"]),
          ]
          TOPIC_ORDER = [name for name, _ in TOPIC_RULES] + ["AI Trend"]

          SAMPLE_ITEMS = [
              {
                  "source":"OpenAI News", "kind":"official_lab", "title":"New agent capabilities reshape enterprise AI adoption",
                  "url":"https://example.com/openai-agent-capabilities", "summary":"A major AI lab introduced new agent capabilities aimed at automating complex workflows, improving tool use and supporting enterprise deployment.",
                  "published": NOW - dt.timedelta(days=1, hours=2)
              },
              {
                  "source":"Retail Dive", "kind":"retail", "title":"Retailers test AI for inventory visibility and store operations",
                  "url":"https://example.com/retail-ai-inventory", "summary":"Retailers are exploring AI-driven inventory signals, associate tooling and store operations analytics to improve availability and reduce manual work.",
                  "published": NOW - dt.timedelta(days=2, hours=4)
              },
              {
                  "source":"VentureBeat AI", "kind":"ai_news", "title":"AI governance becomes board-level issue as adoption scales",
                  "url":"https://example.com/ai-governance", "summary":"As generative AI moves from pilots to production, organizations are investing in stronger governance, evaluation and responsible AI controls.",
                  "published": NOW - dt.timedelta(days=3, hours=1)
              },
              {
                  "source":"Modern Retail", "kind":"retail", "title":"Brands rethink personalization as consumer data strategies mature",
                  "url":"https://example.com/customer-loyalty-ai", "summary":"Consumer brands and retailers are evaluating how AI can improve personalization, loyalty and digital commerce without losing customer trust.",
                  "published": NOW - dt.timedelta(days=4, hours=3)
              },
              {
                  "source":"NVIDIA Blog", "kind":"platform", "title":"AI infrastructure demand pushes new approaches to inference efficiency",
                  "url":"https://example.com/inference-efficiency", "summary":"Platform vendors are focusing on more efficient inference, lower latency and scalable infrastructure for enterprise AI workloads.",
                  "published": NOW - dt.timedelta(days=5, hours=5)
              },
          ]

          def strip_html(value: str) -> str:
              if not value:
                  return ""
              value = html.unescape(value)
              value = re.sub(r"<script[\s\S]*?</script>", " ", value, flags=re.I)
              value = re.sub(r"<style[\s\S]*?</style>", " ", value, flags=re.I)
              value = re.sub(r"<[^>]+>", " ", value)
              value = re.sub(r"\s+", " ", value).strip()
              return value

          def truncate(value: str, max_len: int = 300) -> str:
              value = strip_html(value)
              if len(value) <= max_len:
                  return value
              cut = value[:max_len].rsplit(" ", 1)[0]
              return cut.rstrip(".,;:") + "…"

          def slugify(value: str) -> str:
              value = value.lower()
              value = value.replace("&", " and ")
              value = re.sub(r"[^a-z0-9]+", "-", value)
              return value.strip("-") or "topic"

          def parse_date(value: str):
              if not value:
                  return None
              value = value.strip()
              try:
                  parsed = email.utils.parsedate_to_datetime(value)
                  if parsed.tzinfo is None:
                      parsed = parsed.replace(tzinfo=dt.timezone.utc)
                  return parsed.astimezone(TZ)
              except Exception:
                  pass
              try:
                  cleaned = value.replace("Z", "+00:00")
                  parsed = dt.datetime.fromisoformat(cleaned)
                  if parsed.tzinfo is None:
                      parsed = parsed.replace(tzinfo=dt.timezone.utc)
                  return parsed.astimezone(TZ)
              except Exception:
                  return None

          def fetch_feed(source):
              req = urllib.request.Request(
                  source["url"],
                  headers={
                      "User-Agent": "Mozilla/5.0 (compatible; CGI-AI-Retail-Weekstream/2.0)",
                      "Accept": "application/rss+xml, application/atom+xml, application/xml, text/xml, */*",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  return response.read()

          def text_of(elem, *names):
              for name in names:
                  found = elem.find(name)
                  if found is not None and found.text:
                      return found.text.strip()
              return ""

          def parse_feed(xml_bytes, source):
              root = ET.fromstring(xml_bytes)
              items = []
              # RSS items
              for item in root.findall(".//item"):
                  title = text_of(item, "title")
                  link = text_of(item, "link")
                  if not link:
                      guid = text_of(item, "guid")
                      link = guid if guid.startswith("http") else ""
                  summary = text_of(item, "description", "summary")
                  date_raw = text_of(item, "pubDate", "published", "updated", "dc:date")
                  items.append({
                      "source": source["name"],
                      "kind": source["kind"],
                      "title": strip_html(title),
                      "url": link.strip(),
                      "summary": truncate(summary, 520),
                      "published": parse_date(date_raw),
                  })
              # Atom entries
              ns = {"atom": "http://www.w3.org/2005/Atom"}
              for entry in root.findall(".//atom:entry", ns):
                  title = text_of(entry, "{http://www.w3.org/2005/Atom}title")
                  summary = text_of(entry, "{http://www.w3.org/2005/Atom}summary", "{http://www.w3.org/2005/Atom}content")
                  date_raw = text_of(entry, "{http://www.w3.org/2005/Atom}published", "{http://www.w3.org/2005/Atom}updated")
                  link = ""
                  for link_el in entry.findall("{http://www.w3.org/2005/Atom}link"):
                      href = link_el.attrib.get("href", "")
                      rel = link_el.attrib.get("rel", "alternate")
                      if href and rel in ("alternate", ""):
                          link = href
                          break
                  items.append({
                      "source": source["name"],
                      "kind": source["kind"],
                      "title": strip_html(title),
                      "url": link.strip(),
                      "summary": truncate(summary, 520),
                      "published": parse_date(date_raw),
                  })
              return [item for item in items if item.get("title") and item.get("url")]

          def count_terms(text, terms):
              text_l = f" {text.lower()} "
              total = 0
              for term in terms:
                  pattern = term.lower()
                  if pattern in text_l:
                      total += 1
              return total

          def classify_topics(text, kind):
              topics = []
              text_l = text.lower()
              for topic, terms in TOPIC_RULES:
                  if any(term.lower() in text_l for term in terms):
                      topics.append(topic)
              if kind == "retail" and "Retail & Consumer Services" not in topics:
                  topics.insert(0, "Retail & Consumer Services")
              if not topics:
                  topics.append("AI Trend")
              # Keep stable editorial order
              ordered = [topic for topic in TOPIC_ORDER if topic in topics]
              return ordered[:4]

          def cgi_angle(article):
              topics = set(article["topics"])
              title_l = article["title"].lower()
              if "Retail & Consumer Services" in topics:
                  if "Supply Chain & Forecasting" in topics:
                      return "Relevant voor CGI Retail & Consumer Services omdat dit raakt aan beschikbaarheid, demand planning en operationele betrouwbaarheid. Het artikel kan helpen in klantgesprekken over datakwaliteit, forecasting, integratie met bestaande retailplatformen en de stap van pilots naar schaalbare AI-oplossingen."
                  if "Customer & Loyalty" in topics:
                      return "Relevant voor CGI Retail & Consumer Services omdat AI hier direct raakt aan klantbeleving, personalisatie en loyaliteit. Voor retailklanten is dit vooral bruikbaar in gesprekken over klantdata, omnichannel journey's, consent, meetbare businesswaarde en verantwoord gebruik van klantinzichten."
                  if "Pricing & Merchandising" in topics:
                      return "Relevant voor CGI Retail & Consumer Services omdat pricing, promoties en assortiment steeds vaker datagedreven en AI-ondersteund worden. Dit is interessant voor proposities rond commerciële besluitvorming, scenarioanalyse, governance en aansluiting op commerce- en ERP-platformen."
                  if "Store Operations" in topics:
                      return "Relevant voor CGI Retail & Consumer Services omdat AI in winkeloperaties kan bijdragen aan productiviteit, servicekwaliteit en betere ondersteuning van medewerkers. Dit kan richting geven aan klantgesprekken over adoptie, procesontwerp, integratie en change management."
                  return "Relevant voor CGI Retail & Consumer Services omdat dit laat zien hoe AI, data en digitale platformen de retail- en consumer-servicesketen veranderen. Goed bruikbaar als signaal voor klantgesprekken over roadmap, prioriteiten, governance en schaalbare implementatie."
              if "Governance, Risk & Responsible AI" in topics:
                  return "Goed om te volgen voor CGI Retail & Consumer Services omdat governance, security en responsible AI randvoorwaarden zijn voor productiegebruik bij klanten. Dit helpt om klantgesprekken te voeren over risico's, beleid, controles, compliance en beheersbare adoptie."
              if "AI Agents & Automation" in topics:
                  return "Interessant voor CGI omdat agents en workflowautomatisering invloed hebben op toekomstige deliverymodellen, klantprocessen en medewerkerproductiviteit. Voor Retail & Consumer Services is dit vooral relevant waar processen veel handmatige stappen, systemen en uitzonderingen bevatten."
              if "Data, Platforms & Cloud" in topics:
                  return "Relevant voor CGI omdat platformkeuzes, cloudkosten, datavolwassenheid en integratie bepalen of AI schaalbaar wordt. Voor retailklanten is dit goed om te volgen bij roadmapgesprekken over architectuur, vendorselectie en de stap van experiment naar productie."
              if "GenAI & Foundation Models" in topics:
                  return "Goed om te weten voor CGI Retail & Consumer Services omdat ontwikkelingen in modellen en tooling snel doorwerken in klantverwachtingen, vendor-roadmaps en mogelijke use-cases. Dit is vooral relevant om advies, delivery en proof-of-value trajecten actueel te houden."
              return "Goed om te volgen als AI-marktsignaal voor CGI Retail & Consumer Services. Het artikel kan helpen om klantvragen, proposities en interne kennisontwikkeling actueel te houden, ook wanneer de ontwikkeling niet direct een retail-use-case is."

          def normalize_key(article):
              base = article.get("url") or article.get("title", "")
              base = re.sub(r"[?#].*$", "", base.lower()).strip()
              if not base:
                  base = re.sub(r"[^a-z0-9]+", " ", article.get("title", "").lower()).strip()
              return hashlib.sha1(base.encode("utf-8")).hexdigest()

          raw_items = []
          fetch_errors = []
          if os.environ.get("DEMO_MODE") == "1":
              raw_items = SAMPLE_ITEMS[:]
          else:
              for source in SOURCES:
                  try:
                      xml_bytes = fetch_feed(source)
                      raw_items.extend(parse_feed(xml_bytes, source))
                  except Exception as exc:
                      fetch_errors.append({"source": source["name"], "error": str(exc)[:220]})

          dedup = {}
          for item in raw_items:
              published = item.get("published") or NOW
              if published < CUTOFF or published > NOW + dt.timedelta(days=1):
                  continue
              text = " ".join([item.get("title", ""), item.get("summary", ""), item.get("source", "")])
              ai_score = count_terms(text, AI_TERMS)
              retail_score = count_terms(text, RETAIL_TERMS)
              tech_score = count_terms(text, TECH_TERMS)
              include = False
              if item.get("kind") in ("ai_news", "official_lab", "research", "platform") and ai_score > 0:
                  include = True
              if item.get("kind") == "retail" and (ai_score > 0 or tech_score > 0 or retail_score >= 2):
                  include = True
              if not include:
                  continue
              topics = classify_topics(text, item.get("kind", ""))
              recency_score = max(0, 7 - (NOW - published).days)
              relevance = ai_score * 3 + retail_score * 2 + tech_score + recency_score
              if item.get("kind") == "retail":
                  relevance += 4
              if "Retail & Consumer Services" in topics:
                  relevance += 3
              article = {
                  "source": item.get("source", "Unknown source"),
                  "kind": item.get("kind", ""),
                  "title": item.get("title", "Untitled"),
                  "url": item.get("url", "#"),
                  "summary": truncate(item.get("summary") or item.get("title", ""), 300),
                  "published": published,
                  "date_label": published.strftime("%d %b %Y"),
                  "topics": topics,
                  "topic_slugs": [slugify(t) for t in topics],
                  "primary_topic": topics[0],
                  "primary_slug": slugify(topics[0]),
                  "relevance": relevance,
                  "is_retail": "Retail & Consumer Services" in topics or item.get("kind") == "retail",
              }
              article["cgi_angle"] = cgi_angle(article)
              key = normalize_key(article)
              if key not in dedup or article["relevance"] > dedup[key]["relevance"]:
                  dedup[key] = article

          articles = list(dedup.values())
          articles.sort(key=lambda a: (a["relevance"], a["published"]), reverse=True)
          articles = articles[:120]

          # Counts for filters
          topic_counts = {topic: 0 for topic in TOPIC_ORDER}
          for article in articles:
              for topic in article["topics"]:
                  topic_counts[topic] = topic_counts.get(topic, 0) + 1
          filter_topics = [(topic, slugify(topic), topic_counts.get(topic, 0)) for topic in TOPIC_ORDER if topic_counts.get(topic, 0) > 0]

          def h(value):
              return html.escape(str(value or ""), quote=True)

          def visual_card(article):
              label = article["primary_topic"]
              title = article["title"]
              source = article["source"]
              slug = article["primary_slug"]
              icon = {
                  "retail-and-consumer-services": "RCS",
                  "ai-agents-and-automation": "AGENT",
                  "genai-and-foundation-models": "GenAI",
                  "customer-and-loyalty": "CX",
                  "store-operations": "STORE",
                  "supply-chain-and-forecasting": "SUPPLY",
                  "pricing-and-merchandising": "PRICE",
                  "data-platforms-and-cloud": "DATA",
                  "governance-risk-and-responsible-ai": "TRUST",
                  "research-and-market-signals": "SIGNAL",
              }.get(slug, "AI")
              return f'''
              <div class="visual visual-{h(slug)}" aria-hidden="true">
                <div class="visual-orbit"></div>
                <div class="visual-grid"></div>
                <div class="visual-content">
                  <span class="visual-kicker">{h(source)}</span>
                  <strong>{h(icon)}</strong>
                  <span>{h(label)}</span>
                </div>
              </div>'''

          def article_card(article, highlight=False):
              topics_html = "".join([f'<span class="tag">{h(t)}</span>' for t in article["topics"]])
              classes = "article-card highlight-card" if highlight else "article-card"
              return f'''
              <article class="{classes}" data-topics="{' '.join(h(s) for s in article['topic_slugs'])}" data-title="{h(article['title'].lower())}">
                {visual_card(article)}
                <div class="card-body">
                  <div class="meta"><span>{h(article['source'])}</span><span>{h(article['date_label'])}</span><span>{h(article['primary_topic'])}</span></div>
                  <h3>{h(article['title'])}</h3>
                  <p class="summary">{h(article['summary'])}</p>
                  <div class="cgi-angle"><strong>CGI Angle:</strong> {h(article['cgi_angle'])}</div>
                  <div class="tags">{topics_html}</div>
                  <a class="source-button" href="{h(article['url'])}" target="_blank" rel="noopener noreferrer">Lees bronartikel <span>→</span></a>
                </div>
              </article>'''

          def topic_overview():
              if not articles:
                  return "Er zijn deze week geen relevante artikelen opgehaald uit de ingestelde bronnen. Controleer de workflow-run logs als dit onverwacht is."
              top_topics = sorted(topic_counts.items(), key=lambda kv: kv[1], reverse=True)[:4]
              top_topics = [topic for topic, count in top_topics if count > 0]
              topic_sentence = ", ".join(top_topics[:-1]) + (" en " + top_topics[-1] if len(top_topics) > 1 else (top_topics[0] if top_topics else "AI"))
              retail_count = sum(1 for a in articles if a["is_retail"])
              source_names = sorted({a["source"] for a in articles})[:8]
              source_sentence = ", ".join(source_names)
              return (
                  f"Afgelopen week draaide de AI-nieuwsstroom vooral om {topic_sentence}. "
                  f"Voor CGI Retail & Consumer Services zijn met name de signalen rond retailprocessen, klantdata, platformkeuzes, governance en schaalbare AI-adoptie relevant. "
                  f"De briefing bevat {len(articles)} relevante artikelen; daarvan hebben {retail_count} artikelen een duidelijke Retail & Consumer Services-link. "
                  f"De selectie is gebaseerd op actuele RSS-items uit onder meer {source_sentence}."
              )

          filters_html = '<button class="filter-button active" data-filter="all">Alle artikelen</button>'
          for topic, slug, count in filter_topics:
              filters_html += f'<button class="filter-button" data-filter="{h(slug)}">{h(topic)} <span>{count}</span></button>'

          highlights = articles[:6]
          retail_articles = [a for a in articles if a["is_retail"]][:30]
          cards_html = "\n".join(article_card(article) for article in articles)
          highlights_html = "\n".join(article_card(article, highlight=True) for article in highlights)
          retail_html = "\n".join(article_card(article) for article in retail_articles)
          if not cards_html:
              cards_html = f'''
              <div class="empty-state">
                <h3>Geen relevante artikelen gevonden</h3>
                <p>Er zijn deze run geen artikelen binnen de afgelopen 7 dagen opgehaald die door de filters kwamen. Bekijk de workflow logs om te zien of RSS-bronnen tijdelijk niet bereikbaar waren.</p>
              </div>'''
          if not highlights_html:
              highlights_html = cards_html
          if not retail_html:
              retail_html = '<div class="empty-state"><h3>Geen aparte Retail & Consumer Services-items</h3><p>Er zijn deze week geen extra retailgerichte artikelen gevonden binnen de ingestelde bronnen.</p></div>'

          errors_html = ""
          if fetch_errors:
              error_items = "".join(f"<li>{h(e['source'])}: {h(e['error'])}</li>" for e in fetch_errors[:10])
              errors_html = f'''
              <details class="fetch-errors">
                <summary>Technische feedstatus bekijken</summary>
                <p>Sommige feeds waren tijdelijk niet bereikbaar of gaven geen geldige RSS terug. De briefing is gegenereerd met de artikelen die wel beschikbaar waren.</p>
                <ul>{error_items}</ul>
              </details>'''

          html_doc = f'''<!doctype html>
          <html lang="nl">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>CGI AI & Retail Weekstream</title>
            <meta name="description" content="Wekelijkse AI- en Retail & Consumer Services-briefing voor CGI.">
            <style>
              :root {{
                --cgi-red: #e31937;
                --cgi-purple: #5236ab;
                --cgi-black: #000000;
                --cgi-white: #ffffff;
                --surface: #f6f5f7;
                --card: #ffffff;
                --muted: #64606a;
                --line: #e7e3eb;
                --shadow: 0 24px 70px rgba(0,0,0,.12);
                --radius: 24px;
              }}
              * {{ box-sizing: border-box; }}
              html {{ scroll-behavior: smooth; }}
              body {{
                margin: 0;
                font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                color: var(--cgi-black);
                background: radial-gradient(circle at top left, rgba(227,25,55,.10), transparent 28rem), var(--surface);
                line-height: 1.55;
              }}
              a {{ color: inherit; }}
              .page {{ max-width: 1220px; margin: 0 auto; padding: 24px; }}
              .hero {{
                position: relative;
                overflow: hidden;
                border-radius: 34px;
                padding: clamp(28px, 5vw, 58px);
                background: linear-gradient(135deg, var(--cgi-red) 0%, #a82465 52%, var(--cgi-purple) 100%);
                color: var(--cgi-white);
                box-shadow: var(--shadow);
              }}
              .hero::after {{
                content: "";
                position: absolute;
                inset: auto -12% -55% auto;
                width: 54%;
                aspect-ratio: 1;
                border: 1px solid rgba(255,255,255,.28);
                border-radius: 50%;
                box-shadow: 0 0 0 36px rgba(255,255,255,.08), 0 0 0 88px rgba(255,255,255,.05);
              }}
              .nav-row {{ display:flex; justify-content:space-between; gap:18px; align-items:flex-start; position:relative; z-index:1; }}
              .logo {{
                display:inline-flex; align-items:center; justify-content:center;
                background:#fff; color:var(--cgi-red); font-weight:900; letter-spacing:.02em;
                width:84px; height:48px; border-radius:16px; font-size:25px;
              }}
              .issue-meta {{ text-align:right; opacity:.92; font-size:.95rem; }}
              .hero h1 {{ max-width: 850px; margin: 54px 0 14px; font-size: clamp(2.1rem, 5vw, 5.1rem); line-height:.95; letter-spacing:-.06em; }}
              .hero p {{ max-width: 820px; font-size: clamp(1.05rem, 1.7vw, 1.35rem); margin: 0; opacity:.95; }}
              .metric-pill {{
                display:inline-flex; gap:10px; align-items:center; margin-top:28px; padding:12px 18px;
                background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.28); border-radius:999px;
                backdrop-filter: blur(8px); font-weight:800;
              }}
              .section {{ margin-top: 34px; }}
              .panel {{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding: clamp(20px, 3vw, 32px); box-shadow:0 18px 44px rgba(0,0,0,.06); }}
              .section-title {{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:18px; }}
              .section-title h2 {{ margin:0; font-size: clamp(1.55rem, 2.4vw, 2.25rem); letter-spacing:-.035em; }}
              .section-title p {{ margin:0; color:var(--muted); }}
              .week-summary {{ font-size:1.08rem; max-width: 960px; margin: 0; }}
              .filters {{
                position: sticky; top: 10px; z-index: 10;
                display:flex; gap:10px; flex-wrap:wrap; align-items:center;
                padding:14px; border-radius:24px;
                background:rgba(255,255,255,.88); border:1px solid var(--line); box-shadow:0 18px 40px rgba(0,0,0,.08);
                backdrop-filter: blur(12px);
              }}
              .filter-button {{
                border:1px solid var(--line); background:#fff; color:#1c1720; cursor:pointer;
                padding:10px 14px; border-radius:999px; font-weight:800; font-size:.92rem;
                transition: transform .15s ease, border-color .15s ease, background .15s ease;
              }}
              .filter-button:hover {{ transform: translateY(-1px); border-color:rgba(227,25,55,.4); }}
              .filter-button.active {{ background:var(--cgi-red); border-color:var(--cgi-red); color:#fff; }}
              .filter-button span {{ opacity:.7; margin-left:4px; }}
              .visible-counter {{ margin-left:auto; color:var(--muted); font-size:.95rem; padding:0 8px; }}
              .grid {{ display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap:22px; }}
              .grid.highlights {{ grid-template-columns: repeat(2, minmax(0, 1fr)); }}
              .article-card {{
                display:flex; flex-direction:column; min-width:0;
                background:#fff; border:1px solid var(--line); border-radius:28px; overflow:hidden;
                box-shadow:0 16px 38px rgba(0,0,0,.07);
                transition: transform .18s ease, box-shadow .18s ease;
              }}
              .article-card:hover {{ transform: translateY(-3px); box-shadow:0 22px 56px rgba(0,0,0,.11); }}
              .article-card[hidden] {{ display:none !important; }}
              .visual {{
                position:relative; overflow:hidden; aspect-ratio:16/9; min-height:170px; width:100%;
                background: linear-gradient(135deg, #e31937, #5236ab); color:white;
              }}
              .visual::before {{
                content:""; position:absolute; inset:0;
                background: radial-gradient(circle at 18% 16%, rgba(255,255,255,.45), transparent 18%), radial-gradient(circle at 88% 78%, rgba(255,255,255,.26), transparent 24%);
              }}
              .visual-grid {{ position:absolute; inset:0; background-image: linear-gradient(rgba(255,255,255,.14) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.14) 1px, transparent 1px); background-size: 34px 34px; mask-image: linear-gradient(135deg, black, transparent 72%); }}
              .visual-orbit {{ position:absolute; right:-12%; bottom:-40%; width:62%; aspect-ratio:1; border:1px solid rgba(255,255,255,.34); border-radius:50%; box-shadow:0 0 0 24px rgba(255,255,255,.08), 0 0 0 58px rgba(255,255,255,.05); }}
              .visual-content {{ position:absolute; inset:0; display:flex; flex-direction:column; justify-content:flex-end; gap:6px; padding:22px; }}
              .visual-kicker {{ font-size:.78rem; text-transform:uppercase; letter-spacing:.08em; opacity:.9; font-weight:800; }}
              .visual strong {{ font-size: clamp(2.1rem, 7vw, 4rem); line-height:.85; letter-spacing:-.06em; }}
              .visual-content > span:last-child {{ font-size:.95rem; font-weight:800; opacity:.94; }}
              .visual-retail-and-consumer-services {{ background: linear-gradient(135deg, #e31937, #991f3d); }}
              .visual-ai-agents-and-automation {{ background: linear-gradient(135deg, #5236ab, #1c1720); }}
              .visual-genai-and-foundation-models {{ background: linear-gradient(135deg, #e31937, #a82465, #5236ab); }}
              .visual-customer-and-loyalty {{ background: linear-gradient(135deg, #991f3d, #e31937); }}
              .visual-store-operations {{ background: linear-gradient(135deg, #1c1720, #5236ab); }}
              .visual-supply-chain-and-forecasting {{ background: linear-gradient(135deg, #5236ab, #2f245e); }}
              .visual-pricing-and-merchandising {{ background: linear-gradient(135deg, #e31937, #ff6a00); }}
              .visual-data-platforms-and-cloud {{ background: linear-gradient(135deg, #000000, #5236ab); }}
              .visual-governance-risk-and-responsible-ai {{ background: linear-gradient(135deg, #000000, #991f3d); }}
              .visual-research-and-market-signals {{ background: linear-gradient(135deg, #5236ab, #a82465); }}
              .card-body {{ padding:22px; display:flex; flex-direction:column; gap:14px; flex:1; }}
              .meta {{ display:flex; gap:8px; flex-wrap:wrap; color:var(--muted); font-size:.84rem; font-weight:800; }}
              .meta span:not(:last-child)::after {{ content:"·"; margin-left:8px; color:#aaa; }}
              h3 {{ margin:0; font-size:1.22rem; line-height:1.18; letter-spacing:-.025em; }}
              .summary {{ margin:0; color:#403a44; }}
              .cgi-angle {{
                border-left:4px solid var(--cgi-purple); background:#f7f4ff; padding:13px 14px; border-radius:14px;
                color:#1c1720; font-size:.94rem;
              }}
              .tags {{ display:flex; flex-wrap:wrap; gap:8px; margin-top:auto; }}
              .tag {{ background:#f1eef4; color:#31263a; border:1px solid #e4deeb; border-radius:999px; padding:6px 9px; font-size:.78rem; font-weight:800; }}
              .source-button {{
                display:inline-flex; width:fit-content; align-items:center; gap:10px; justify-content:center;
                padding:12px 16px; border-radius:999px; background:var(--cgi-red); color:white; text-decoration:none; font-weight:900;
                box-shadow:0 12px 24px rgba(227,25,55,.22);
              }}
              .source-button:hover {{ background:#c91530; }}
              .source-button span {{ font-size:1.05em; }}
              .empty-state {{ background:#fff; border:1px dashed #c9c2d0; border-radius:24px; padding:28px; grid-column:1/-1; }}
              .fetch-errors {{ margin-top:24px; font-size:.9rem; color:var(--muted); }}
              footer {{ color:var(--muted); padding:34px 0 16px; font-size:.9rem; }}
              @media (max-width: 980px) {{
                .grid, .grid.highlights {{ grid-template-columns: repeat(2, minmax(0, 1fr)); }}
                .visible-counter {{ width:100%; margin-left:0; }}
              }}
              @media (max-width: 680px) {{
                .page {{ padding:14px; }}
                .hero {{ border-radius:24px; }}
                .nav-row {{ flex-direction:column; }}
                .issue-meta {{ text-align:left; }}
                .grid, .grid.highlights {{ grid-template-columns: 1fr; }}
                .filters {{ position:relative; top:auto; border-radius:20px; }}
                .filter-button {{ width:100%; text-align:left; }}
                .visible-counter {{ padding-left:2px; }}
              }}
            </style>
          </head>
          <body>
            <main class="page">
              <header class="hero">
                <div class="nav-row">
                  <div class="logo" aria-label="CGI">CGI</div>
                  <div class="issue-meta">
                    <strong>Weekstream · {h(WEEK_ID)}</strong><br>
                    Laatst bijgewerkt: {h(NOW.strftime('%d %B %Y, %H:%M'))}
                  </div>
                </div>
                <h1>AI & Retail<br>Weekstream</h1>
                <p>Een wekelijkse selectie van relevante AI-ontwikkelingen voor CGI Retail & Consumer Services, met per artikel een praktische CGI Angle.</p>
                <div class="metric-pill"><span id="totalArticles">{len(articles)}</span> relevante artikelen</div>
              </header>

              <section class="section panel">
                <div class="section-title"><h2>Weeksamenvatting</h2></div>
                <p class="week-summary">{h(topic_overview())}</p>
                {errors_html}
              </section>

              <section class="section">
                <div class="filters" aria-label="Themafilters">
                  {filters_html}
                  <div class="visible-counter"><span id="visibleCount">{len(articles)}</span> zichtbaar</div>
                </div>
              </section>

              <section class="section">
                <div class="section-title">
                  <div>
                    <h2>Deze week op de radar</h2>
                    <p>De meest relevante signalen voor klantgesprekken, proposities en delivery.</p>
                  </div>
                </div>
                <div class="grid highlights" id="highlightsGrid">
                  {highlights_html}
                </div>
              </section>

              <section class="section">
                <div class="section-title">
                  <div>
                    <h2>Alle relevante artikelen</h2>
                    <p>Filter op thema om sneller naar de juiste signalen te gaan.</p>
                  </div>
                </div>
                <div class="grid" id="articleGrid">
                  {cards_html}
                </div>
              </section>

              <section class="section">
                <div class="section-title">
                  <div>
                    <h2>Retail & Consumer Services: relevante artikelen</h2>
                    <p>Artikelen met een duidelijke link naar retail, consumentendiensten, klantbeleving, operatie of commerce.</p>
                  </div>
                </div>
                <div class="grid" id="retailGrid">
                  {retail_html}
                </div>
              </section>

              <footer>
                Deze pagina wordt automatisch opgebouwd uit publieke RSS-bronnen en publiceert naar <strong>/latest/</strong>. De vaste link blijft hetzelfde; de inhoud wordt bij elke vrijdagrun vernieuwd.
              </footer>
            </main>
            <script>
              const buttons = Array.from(document.querySelectorAll('.filter-button'));
              const cards = Array.from(document.querySelectorAll('.article-card'));
              const visibleCount = document.getElementById('visibleCount');
              function setFilter(filter) {{
                let visible = 0;
                cards.forEach(card => {{
                  const topics = (card.dataset.topics || '').split(/\s+/);
                  const show = filter === 'all' || topics.includes(filter);
                  card.hidden = !show;
                  if (show && card.closest('#articleGrid')) visible += 1;
                }});
                buttons.forEach(btn => btn.classList.toggle('active', btn.dataset.filter === filter));
                visibleCount.textContent = visible;
                if (filter === 'all') history.replaceState(null, '', location.pathname);
                else history.replaceState(null, '', '#' + filter);
              }}
              buttons.forEach(btn => btn.addEventListener('click', () => setFilter(btn.dataset.filter)));
              const initial = location.hash ? location.hash.slice(1) : 'all';
              if (buttons.some(btn => btn.dataset.filter === initial)) setFilter(initial);
            </script>
          </body>
          </html>'''

          # Keep HTML tidy enough for source inspection.
          html_doc = textwrap.dedent(html_doc).strip() + "\n"
          for path in [LATEST / "index.html", ARCHIVE / "index.html", SITE / "index.html"]:
              path.write_text(html_doc, encoding="utf-8")
          payload = []
          for article in articles:
              row = dict(article)
              row["published"] = article["published"].isoformat()
              payload.append(row)
          for path in [LATEST / "articles.json", ARCHIVE / "articles.json"]:
              path.write_text(json.dumps({"generated_at": NOW.isoformat(), "week": WEEK_ID, "articles": payload, "feed_errors": fetch_errors}, ensure_ascii=False, indent=2), encoding="utf-8")
          (SITE / ".nojekyll").write_text("", encoding="utf-8")
          print(f"Generated {len(articles)} relevant articles for {WEEK_ID}")
          PY

      - name: Configureer GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Publiceer naar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
