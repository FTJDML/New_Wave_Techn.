name: CGI AI Retail Weekly Content Stream

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. In Dutch summer time this is Friday 07:30.
    # In winter it runs at 06:30, still Friday morning.
    - cron: "30 5 * * 5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Generate weekly AI and Retail stream
        shell: bash
        run: |
          python3 --version
          cat > generate_weekstream.py <<'PY'
          import datetime as dt
          import email.utils
          import hashlib
          import html
          import json
          import os
          import re
          import textwrap
          import urllib.error
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from zoneinfo import ZoneInfo

          TZ = ZoneInfo("Europe/Amsterdam")
          NOW = dt.datetime.now(TZ)
          START = NOW - dt.timedelta(hours=168)

          OUT = Path("public")
          LATEST = OUT / "latest"
          WEEK_ID = f"{NOW.isocalendar().year}-W{NOW.isocalendar().week:02d}"
          ARCHIVE = OUT / "content_streams" / WEEK_ID

          SOURCES = [
              {"name": "TechCrunch AI", "url": "https://techcrunch.com/category/artificial-intelligence/feed/", "kind": "ai"},
              {"name": "The Verge AI", "url": "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml", "kind": "ai"},
              {"name": "WIRED AI", "url": "https://www.wired.com/feed/tag/artificial-intelligence/latest/rss", "kind": "ai"},
              {"name": "MIT News AI", "url": "https://news.mit.edu/topic/artificial-intelligence2-rss.xml", "kind": "research"},
              {"name": "OpenAI News", "url": "https://openai.com/news/rss.xml", "kind": "lab"},
              {"name": "Google DeepMind Blog", "url": "https://deepmind.google/blog/rss.xml", "kind": "lab"},
              {"name": "Anthropic News", "url": "https://www.anthropic.com/news/rss.xml", "kind": "lab"},
              {"name": "Hugging Face Papers", "url": "https://huggingface.co/papers/rss", "kind": "research"},
              {"name": "Retail Dive", "url": "https://www.retaildive.com/feeds/news/", "kind": "retail"},
              {"name": "Modern Retail", "url": "https://www.modernretail.co/feed/", "kind": "retail"},
              {"name": "RetailWire", "url": "https://retailwire.com/feed/", "kind": "retail"},
              {"name": "Grocery Dive", "url": "https://www.grocerydive.com/feeds/news/", "kind": "retail"},
          ]

          AI_KEYWORDS = [
              "ai", "artificial intelligence", "generative ai", "genai", "machine learning",
              "language model", "llm", "agent", "agents", "chatbot", "copilot", "automation",
              "reasoning", "model", "multimodal", "computer vision", "robotics", "voice ai",
              "personalization", "recommendation", "data", "synthetic data", "governance",
              "safety", "security", "benchmark", "open source", "chip", "gpu"
          ]
          RETAIL_KEYWORDS = [
              "retail", "consumer", "grocery", "store", "stores", "shopper", "shopping",
              "commerce", "ecommerce", "marketplace", "loyalty", "pricing", "promotion",
              "merchandising", "inventory", "supply chain", "fulfillment", "warehouse",
              "last mile", "customer experience", "personalization", "checkout", "retail media",
              "demand forecasting", "forecasting", "assortment", "fashion", "supermarket"
          ]
          CGI_KEYWORDS = [
              "governance", "platform", "data", "cloud", "security", "compliance", "automation",
              "integration", "operations", "customer experience", "productivity", "cost", "workforce"
          ]

          def strip_tags(text):
              text = re.sub(r"<[^>]+>", " ", text or "")
              text = html.unescape(text)
              text = re.sub(r"\s+", " ", text).strip()
              return text

          def parse_date(value):
              if not value:
                  return None
              value = value.strip()
              try:
                  parsed = email.utils.parsedate_to_datetime(value)
                  if parsed.tzinfo is None:
                      parsed = parsed.replace(tzinfo=dt.timezone.utc)
                  return parsed.astimezone(TZ)
              except Exception:
                  pass
              for fmt in ("%Y-%m-%dT%H:%M:%SZ", "%Y-%m-%dT%H:%M:%S%z", "%Y-%m-%d"):
                  try:
                      parsed = dt.datetime.strptime(value[:25], fmt)
                      if parsed.tzinfo is None:
                          parsed = parsed.replace(tzinfo=dt.timezone.utc)
                      return parsed.astimezone(TZ)
                  except Exception:
                      continue
              return None

          def get_text(node, names):
              for name in names:
                  found = node.find(name)
                  if found is not None and found.text:
                      return found.text.strip()
              for child in list(node):
                  local = child.tag.split("}")[-1].lower()
                  if local in [n.split("}")[-1].lower() for n in names] and child.text:
                      return child.text.strip()
              return ""

          def get_link(node):
              # RSS link
              link = get_text(node, ["link", "{http://www.w3.org/2005/Atom}link"])
              if link:
                  return link
              # Atom link href
              for child in list(node):
                  if child.tag.split("}")[-1].lower() == "link":
                      href = child.attrib.get("href")
                      if href:
                          return href
              return ""

          def fetch_source(source):
              req = urllib.request.Request(
                  source["url"],
                  headers={"User-Agent": "CGI-AI-Retail-Weekstream/1.0 (+GitHub Actions)"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      data = response.read()
              except urllib.error.HTTPError as e:
                  print(f"WARN: {source['name']} HTTP {e.code}")
                  return []
              except Exception as e:
                  print(f"WARN: {source['name']} failed: {e}")
                  return []
              try:
                  root = ET.fromstring(data)
              except ET.ParseError as e:
                  print(f"WARN: {source['name']} parse failed: {e}")
                  return []

              nodes = []
              nodes.extend(root.findall(".//item"))
              nodes.extend(root.findall(".//{http://www.w3.org/2005/Atom}entry"))
              items = []
              for node in nodes:
                  title = strip_tags(get_text(node, ["title", "{http://www.w3.org/2005/Atom}title"]))
                  link = get_link(node)
                  summary = strip_tags(get_text(node, ["description", "summary", "content", "{http://www.w3.org/2005/Atom}summary", "{http://www.w3.org/2005/Atom}content"]))
                  date_text = get_text(node, ["pubDate", "published", "updated", "dc:date", "{http://purl.org/dc/elements/1.1/}date", "{http://www.w3.org/2005/Atom}published", "{http://www.w3.org/2005/Atom}updated"])
                  published = parse_date(date_text) or NOW
                  if not title or not link:
                      continue
                  if published < START - dt.timedelta(days=1):
                      continue
                  items.append({
                      "title": title,
                      "url": link,
                      "summary": summary[:600],
                      "published": published,
                      "source": source["name"],
                      "source_kind": source["kind"],
                  })
              return items

          def count_matches(text, keywords):
              lower = text.lower()
              count = 0
              hits = []
              for kw in keywords:
                  if kw in lower:
                      count += 1
                      hits.append(kw)
              return count, hits[:6]

          def categorize(item, ai_hits, retail_hits):
              text = (item["title"] + " " + item.get("summary", "")).lower()
              if any(k in text for k in ["agent", "copilot", "automation"]):
                  return "AI agents & automation"
              if any(k in text for k in ["governance", "safety", "security", "compliance", "regulation"]):
                  return "Governance, trust & security"
              if any(k in text for k in ["retail media", "loyalty", "customer", "shopper", "personalization", "recommendation"]):
                  return "Customer experience & personalization"
              if any(k in text for k in ["inventory", "supply chain", "fulfillment", "forecasting", "warehouse"]):
                  return "Operations, supply chain & forecasting"
              if any(k in text for k in ["model", "llm", "benchmark", "open source", "research", "reasoning"]):
                  return "Models, research & platforms"
              if any(k in text for k in ["chip", "gpu", "cloud", "infrastructure", "data center"]):
                  return "AI infrastructure"
              return "AI trend"

          def cgi_angle(item, category, retail_score):
              if retail_score >= 2:
                  if "supply" in category.lower() or "forecast" in category.lower() or "operations" in category.lower():
                      return "CGI Angle: relevant voor gesprekken met retailklanten over voorspelbaarheid, voorraadbeschikbaarheid, supply chain efficiency en de datavolwassenheid die nodig is om AI operationeel betrouwbaar te maken."
                  if "customer" in category.lower() or "personalization" in category.lower():
                      return "CGI Angle: bruikbaar voor Retail & Consumer Services omdat het raakt aan personalisatie, loyalty, klantdata en omnichannel klantbeleving; thema's waar CGI klanten kan helpen van idee naar schaalbare implementatie."
                  return "CGI Angle: interessant voor Retail & Consumer Services omdat het laat zien waar AI concrete waarde kan krijgen in winkels, commerce, klantinteractie of retailoperaties."
              if "governance" in category.lower() or "security" in category.lower():
                  return "CGI Angle: goed om te volgen voor klantadvies rond responsible AI, security, governance en beheersbare adoptie van AI in enterprise-omgevingen."
              if "infrastructure" in category.lower() or "platform" in category.lower() or "models" in category.lower():
                  return "CGI Angle: relevant voor CGI als technologie- en deliverypartner omdat modelkeuzes, platformarchitectuur, kosten en integratie-impact steeds bepalender worden in AI-roadmaps."
              if "agents" in category.lower() or "automation" in category.lower():
                  return "CGI Angle: relevant voor proposities rond productiviteit, procesautomatisering en agentic workflows; vooral wanneer klanten vragen hoe AI veilig in bestaande processen kan worden ingebed."
              return "CGI Angle: goed om op de radar te houden als algemene AI-ontwikkeling die klantverwachtingen, vendor-roadmaps of toekomstige AI-proposities kan beinvloeden."

          def score_item(item):
              text = f"{item['title']} {item.get('summary','')} {item['source']}"
              ai_count, ai_hits = count_matches(text, AI_KEYWORDS)
              retail_count, retail_hits = count_matches(text, RETAIL_KEYWORDS)
              cgi_count, cgi_hits = count_matches(text, CGI_KEYWORDS)
              score = ai_count * 3 + retail_count * 2 + cgi_count
              if item["source_kind"] in ("lab", "research"):
                  score += 2
              if item["source_kind"] == "retail" and ai_count > 0:
                  score += 4
              if item["source_kind"] == "retail" and ai_count == 0:
                  score -= 3
              if item["published"] >= NOW - dt.timedelta(days=3):
                  score += 2
              category = categorize(item, ai_hits, retail_hits)
              item.update({
                  "ai_score": ai_count,
                  "retail_score": retail_count,
                  "cgi_score": cgi_count,
                  "score": score,
                  "tags": list(dict.fromkeys(ai_hits + retail_hits + cgi_hits))[:6],
                  "category": category,
                  "cgi_angle": cgi_angle(item, category, retail_count),
              })
              return item

          def short_summary(item):
              summary = item.get("summary") or ""
              summary = re.sub(r"\s+", " ", summary).strip()
              if not summary:
                  summary = "Nieuw artikel over AI-ontwikkelingen met mogelijke relevantie voor CGI, Retail & Consumer Services en klantgesprekken."
              if len(summary) > 240:
                  summary = summary[:237].rsplit(" ", 1)[0] + "..."
              return summary

          def visual_class(category):
              key = category.lower()
              if "customer" in key or "personal" in key:
                  return "visual-customer"
              if "operations" in key or "supply" in key:
                  return "visual-ops"
              if "governance" in key or "security" in key:
                  return "visual-trust"
              if "infrastructure" in key:
                  return "visual-infra"
              if "model" in key or "research" in key:
                  return "visual-models"
              return "visual-ai"

          def load_items():
              raw = []
              for source in SOURCES:
                  raw.extend(fetch_source(source))
              dedup = {}
              for item in raw:
                  key = re.sub(r"[^a-z0-9]+", "", item["title"].lower())[:90]
                  if key not in dedup or item["published"] > dedup[key]["published"]:
                      dedup[key] = item
              items = [score_item(x) for x in dedup.values()]
              # Relevance rule: general AI articles, plus retail articles that mention AI/data/automation.
              items = [x for x in items if x["score"] >= 5 and (x["ai_score"] > 0 or x["retail_score"] > 0)]
              items.sort(key=lambda x: (x["score"], x["published"]), reverse=True)
              return items[:80]

          def sample_items():
              data = [
                  ("AI agents move from pilots to workflow integration", "TechCrunch AI", "AI agents & automation", 0),
                  ("Retailers test AI for demand forecasting and store operations", "Retail Dive", "Operations, supply chain & forecasting", 4),
                  ("New model release raises questions about governance and data security", "OpenAI News", "Governance, trust & security", 1),
                  ("Personalization and loyalty become a focus for commerce AI", "Modern Retail", "Customer experience & personalization", 4),
                  ("Research labs publish new benchmarks for reasoning models", "MIT News AI", "Models, research & platforms", 0),
                  ("AI infrastructure costs reshape enterprise adoption plans", "WIRED AI", "AI infrastructure", 0),
              ]
              items = []
              for i, (title, source, category, retail) in enumerate(data):
                  item = {
                      "title": title,
                      "url": "https://example.com/",
                      "summary": "Sample item for the initial preview. A live Friday run will replace this with articles collected from the configured international AI and retail sources.",
                      "published": NOW - dt.timedelta(hours=i * 8),
                      "source": source,
                      "source_kind": "retail" if retail else "ai",
                      "ai_score": 2,
                      "retail_score": retail,
                      "cgi_score": 1,
                      "score": 10 - i,
                      "tags": ["ai", "retail"] if retail else ["ai"],
                      "category": category,
                  }
                  item["cgi_angle"] = cgi_angle(item, category, retail)
                  items.append(item)
              return items

          def week_summary(items):
              if not items:
                  return [
                      "Er zijn deze week geen artikelen gevonden binnen de ingestelde bronnen en relevantieregels.",
                      "Controleer de bronfeeds of draai de workflow later opnieuw."
                  ]
              cats = {}
              for item in items:
                  cats[item["category"]] = cats.get(item["category"], 0) + 1
              top = sorted(cats.items(), key=lambda x: x[1], reverse=True)[:4]
              bullets = []
              for cat, count in top:
                  if cat == "AI agents & automation":
                      bullets.append("AI-agents en automatisering blijven een belangrijk thema: de focus verschuift van losse demo's naar integratie in concrete werkprocessen.")
                  elif cat == "Governance, trust & security":
                      bullets.append("Governance, trust en security komen nadrukkelijk terug; relevant voor klanten die AI willen opschalen zonder controle en compliance te verliezen.")
                  elif cat == "Customer experience & personalization":
                      bullets.append("Binnen Retail & Consumer Services ligt de nadruk op personalisatie, loyalty en klantinteractie, vaak met klantdata als bepalende randvoorwaarde.")
                  elif cat == "Operations, supply chain & forecasting":
                      bullets.append("Retailoperaties, forecasting en supply chain blijven kansrijke toepassingsgebieden omdat AI daar direct kan raken aan marge, beschikbaarheid en efficiency.")
                  elif cat == "Models, research & platforms":
                      bullets.append("Model- en platformontwikkelingen gaan snel; CGI-teams moeten blijven volgen welke keuzes impact hebben op architectuur, kosten en delivery.")
                  elif cat == "AI infrastructure":
                      bullets.append("AI-infrastructuur en kosten blijven bepalend voor schaalbaarheid, vooral bij enterprise-klanten met grote data- en integratievragen.")
                  else:
                      bullets.append("De week laat zien dat AI zich breed blijft ontwikkelen, met gevolgen voor klantverwachtingen, platformkeuzes en nieuwe proposities.")
              return bullets[:4]

          def card(item, featured=False):
              tags = "".join(f"<span>{html.escape(t)}</span>" for t in item.get("tags", [])[:5])
              date = item["published"].strftime("%d %b %Y")
              cls = visual_class(item["category"])
              return f'''
              <article class="card {'featured' if featured else ''}">
                <div class="visual {cls}">
                  <div class="visual-mark">AI</div>
                  <div class="visual-label">{html.escape(item['category'])}</div>
                </div>
                <div class="card-body">
                  <div class="meta"><strong>{html.escape(item['source'])}</strong><span>{date}</span></div>
                  <h3>{html.escape(item['title'])}</h3>
                  <p>{html.escape(short_summary(item))}</p>
                  <p class="angle">{html.escape(item['cgi_angle'])}</p>
                  <div class="tags">{tags}</div>
                  <a class="link" href="{html.escape(item['url'])}" target="_blank" rel="noopener">Lees bronartikel</a>
                </div>
              </article>
              '''

          def render(items):
              retail_items = [x for x in items if x.get("retail_score", 0) >= 1 or x.get("source_kind") == "retail"][:40]
              top_items = items[:6]
              bullets = week_summary(items)
              bullet_html = "".join(f"<li>{html.escape(b)}</li>" for b in bullets)
              cards_featured = "".join(card(x, True) for x in top_items)
              cards_all = "".join(card(x) for x in items)
              cards_retail = "".join(card(x) for x in retail_items) or "<p class='empty'>Geen retail-specifieke artikelen gevonden in de afgelopen week.</p>"
              start = START.strftime("%d %b %Y")
              end = NOW.strftime("%d %b %Y")
              generated = NOW.strftime("%A %d %B %Y, %H:%M")
              css = '''
              :root{--cgi-red:#e31937;--cgi-purple:#5236ab;--black:#000;--white:#fff;--soft:#f6f4f7;--line:#e9e4ec;--text:#171417;--muted:#5f5661}
              *{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--soft);color:var(--text);line-height:1.45}
              a{color:inherit}.hero{background:linear-gradient(135deg,var(--cgi-red),#a82465,var(--cgi-purple));color:#fff;padding:40px 24px 34px}.wrap{max-width:1180px;margin:0 auto}.brand{display:flex;align-items:center;gap:14px;margin-bottom:30px}.logo{background:#fff;color:var(--cgi-red);font-weight:900;letter-spacing:-1px;padding:10px 16px;border-radius:3px;font-size:28px}.brand span{font-size:14px;opacity:.9}.hero h1{font-size:clamp(34px,5vw,66px);line-height:1;margin:0 0 14px;letter-spacing:-2px}.hero p{max-width:820px;font-size:18px;margin:0;opacity:.94}.statbar{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.stat{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.26);padding:12px 16px;border-radius:18px;font-weight:700}.main{padding:28px 24px 56px}.summary{background:#fff;border:1px solid var(--line);border-radius:26px;padding:26px;margin-bottom:24px;box-shadow:0 10px 30px rgba(0,0,0,.04)}.summary h2,.section h2{margin:0 0 12px;font-size:28px;letter-spacing:-.5px}.summary ul{margin:0;padding-left:20px}.summary li{margin:8px 0}.section{margin-top:32px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:26px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 10px 28px rgba(0,0,0,.045)}.card.featured{border-color:#d7c9f8}.visual{aspect-ratio:16/9;min-height:180px;position:relative;overflow:hidden;color:#fff;background:linear-gradient(135deg,var(--cgi-red),var(--cgi-purple));display:flex;align-items:flex-end;padding:18px}.visual:before{content:"";position:absolute;inset:-40%;background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.35),transparent 22%),radial-gradient(circle at 80% 10%,rgba(255,255,255,.22),transparent 18%),linear-gradient(90deg,rgba(255,255,255,.13) 1px,transparent 1px),linear-gradient(0deg,rgba(255,255,255,.13) 1px,transparent 1px);background-size:auto,auto,36px 36px,36px 36px;transform:rotate(-8deg)}.visual-mark{position:absolute;top:16px;left:16px;background:rgba(0,0,0,.78);border-radius:14px;padding:10px 12px;font-size:22px;font-weight:900}.visual-label{position:relative;font-weight:800;font-size:18px;max-width:80%;text-shadow:0 2px 12px rgba(0,0,0,.35)}.visual-customer{background:linear-gradient(135deg,#e31937,#ff6a00)}.visual-ops{background:linear-gradient(135deg,#000,#5236ab)}.visual-trust{background:linear-gradient(135deg,#000,#e31937)}.visual-infra{background:linear-gradient(135deg,#5236ab,#000)}.visual-models{background:linear-gradient(135deg,#5236ab,#a82465,#e31937)}.card-body{padding:20px;display:flex;flex-direction:column;gap:11px;flex:1}.meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:13px}.card h3{font-size:21px;line-height:1.15;margin:0;letter-spacing:-.3px}.card p{margin:0;color:#332d34}.angle{background:#faf7fb;border-left:4px solid var(--cgi-red);padding:12px;border-radius:12px;color:#221b23!important;font-size:14px}.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:auto}.tags span{font-size:12px;padding:6px 9px;border-radius:999px;background:#f0eaf7;color:#3e2f65}.link{display:inline-block;text-decoration:none;font-weight:800;color:var(--cgi-red);margin-top:4px}.footer{border-top:1px solid var(--line);color:var(--muted);font-size:13px;padding:22px 24px;background:#fff}.empty{background:#fff;border:1px dashed var(--line);border-radius:18px;padding:18px;color:var(--muted)}@media(max-width:680px){.hero{padding:28px 18px}.main{padding:20px 14px 42px}.summary{padding:20px;border-radius:20px}.meta{display:block}.visual{min-height:150px}.logo{font-size:23px}.card h3{font-size:19px}}
              '''
              html_doc = f'''<!doctype html>
              <html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CGI AI & Retail Weekstream</title><style>{css}</style></head>
              <body>
                <header class="hero"><div class="wrap">
                  <div class="brand"><div class="logo">CGI</div><span>Retail & Consumer Services</span></div>
                  <h1>AI & Retail Weekstream</h1>
                  <p>Wekelijkse selectie van relevante AI-ontwikkelingen en retail/consumer-services signalen uit internationale bronnen.</p>
                  <div class="statbar"><div class="stat">{len(items)} relevante artikelen</div><div class="stat">Week: {html.escape(WEEK_ID)}</div></div>
                </div></header>
                <main class="main"><div class="wrap">
                  <section class="summary"><h2>Weeksamenvatting</h2><p>Overzicht van wat er afgelopen week op AI-gebied gebeurde en wat nuttig is voor CGI Retail & Consumer Services.</p><ul>{bullet_html}</ul></section>
                  <section class="section"><h2>Topselectie deze week</h2><div class="grid">{cards_featured}</div></section>
                  <section class="section"><h2>Alle relevante AI-artikelen</h2><div class="grid">{cards_all}</div></section>
                  <section class="section"><h2>Retail & Consumer Services: relevante artikelen</h2><div class="grid">{cards_retail}</div></section>
                </div></main>
                <footer class="footer"><div class="wrap">Gegenereerd op {html.escape(generated)} Europe/Amsterdam. Periode: {html.escape(start)} t/m {html.escape(end)}. Bronartikelen blijven eigendom van de oorspronkelijke publicaties.</div></footer>
              </body></html>'''
              return html_doc

          def write_site(html_doc, items):
              for folder in (LATEST, ARCHIVE):
                  folder.mkdir(parents=True, exist_ok=True)
                  (folder / "index.html").write_text(html_doc, encoding="utf-8")
                  data = []
                  for item in items:
                      copy = dict(item)
                      copy["published"] = item["published"].isoformat()
                      data.append(copy)
                  (folder / "articles.json").write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
              OUT.mkdir(parents=True, exist_ok=True)
              (OUT / "index.html").write_text('<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=latest/"><title>CGI AI Weekstream</title><p><a href="latest/">Open latest</a></p>', encoding="utf-8")
              (OUT / ".nojekyll").write_text("", encoding="utf-8")

          def main():
              items = load_items()
              if not items:
                  print("WARN: no live items found; creating fallback preview so the page is not empty")
                  items = sample_items()
              html_doc = render(items)
              write_site(html_doc, items)
              print(f"Generated {len(items)} items")
              print(f"Latest: {LATEST / 'index.html'}")
              print(f"Archive: {ARCHIVE / 'index.html'}")

          if __name__ == "__main__":
              main()
