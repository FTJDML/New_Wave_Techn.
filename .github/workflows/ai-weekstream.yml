name: CGI AI Retail & Consumer Services Weekstream - ACTIVE

on:
  workflow_dispatch:
  schedule:
    # Elke vrijdag om 07:30 Europe/Amsterdam.
    - cron: "30 7 * * 5"
      timezone: Europe/Amsterdam

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Genereer CGI AI & Retail weekstream
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime as dt
          import email.utils
          import hashlib
          import html
          import json
          import os
          import re
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path
          try:
              from zoneinfo import ZoneInfo
          except Exception:
              ZoneInfo = None
          
          VERSION = "v4.0-active-root-latest-login-filters"
          ACCESS_CODE_HASH = "7f9aa7542a6e2d53ce2eb1cf957faedbecc10c6f9a071dfdeb290d8a4d122359"  # NT2026!
          TZ = ZoneInfo("Europe/Amsterdam") if ZoneInfo else dt.timezone.utc
          NOW = dt.datetime.now(TZ)
          CUTOFF = NOW - dt.timedelta(days=7)
          SITE = Path(os.environ.get("SITE_DIR", "site"))
          LATEST = SITE / "latest"
          WEEK_ID = f"{NOW.isocalendar().year}-W{NOW.isocalendar().week:02d}"
          ARCHIVE = SITE / "content_streams" / WEEK_ID
          LATEST.mkdir(parents=True, exist_ok=True)
          ARCHIVE.mkdir(parents=True, exist_ok=True)
          
          SOURCES = [
              {"name":"TechCrunch AI", "url":"https://techcrunch.com/category/artificial-intelligence/feed/", "kind":"ai_news"},
              {"name":"The Verge AI", "url":"https://www.theverge.com/rss/ai-artificial-intelligence/index.xml", "kind":"ai_news"},
              {"name":"WIRED AI", "url":"https://www.wired.com/feed/tag/artificial-intelligence/latest/rss", "kind":"ai_news"},
              {"name":"VentureBeat AI", "url":"https://venturebeat.com/category/ai/feed/", "kind":"ai_news"},
              {"name":"The Decoder", "url":"https://the-decoder.com/feed/", "kind":"ai_news"},
              {"name":"MIT News AI", "url":"https://news.mit.edu/rss/topic/artificial-intelligence2", "kind":"research"},
              {"name":"OpenAI News", "url":"https://openai.com/news/rss.xml", "kind":"official_lab"},
              {"name":"Google DeepMind Blog", "url":"https://deepmind.google/discover/blog/rss.xml", "kind":"official_lab"},
              {"name":"Anthropic News", "url":"https://www.anthropic.com/news/rss.xml", "kind":"official_lab"},
              {"name":"Hugging Face Papers", "url":"https://huggingface.co/papers/rss", "kind":"research"},
              {"name":"NVIDIA Blog", "url":"https://blogs.nvidia.com/feed/", "kind":"platform"},
              {"name":"Microsoft AI Blog", "url":"https://blogs.microsoft.com/ai/feed/", "kind":"platform"},
              {"name":"Retail Dive", "url":"https://www.retaildive.com/feeds/news/", "kind":"retail"},
              {"name":"Modern Retail", "url":"https://www.modernretail.co/feed/", "kind":"retail"},
              {"name":"RetailWire", "url":"https://retailwire.com/feed/", "kind":"retail"},
              {"name":"Grocery Dive", "url":"https://www.grocerydive.com/feeds/news/", "kind":"retail"},
              {"name":"Retail TouchPoints", "url":"https://www.retailtouchpoints.com/feed", "kind":"retail"},
              {"name":"Digital Commerce 360", "url":"https://www.digitalcommerce360.com/feed/", "kind":"retail"},
              {"name":"NRF", "url":"https://nrf.com/rss.xml", "kind":"retail"},
          ]
          
          AI_TERMS = [
              "ai", "artificial intelligence", "generative ai", "genai", "machine learning", "ml", "llm", "large language",
              "foundation model", "model", "chatgpt", "openai", "claude", "anthropic", "gemini", "deepmind",
              "copilot", "agent", "agents", "assistant", "automation", "autonomous", "multimodal", "inference",
              "training", "synthetic data", "robot", "robotics", "computer vision", "voice ai", "reasoning"
          ]
          RETAIL_TERMS = [
              "retail", "retailer", "consumer", "customer", "shopper", "shopping", "ecommerce", "e-commerce", "commerce",
              "omnichannel", "store", "stores", "grocery", "fashion", "marketplace", "loyalty", "personalization",
              "personalisation", "checkout", "pos", "inventory", "supply chain", "forecast", "forecasting", "warehouse",
              "fulfillment", "fulfilment", "pricing", "promotion", "merchandising", "assortment", "qsr", "hospitality"
          ]
          TECH_TERMS = [
              "data", "platform", "cloud", "api", "software", "digital", "analytics", "automation", "cyber", "security",
              "privacy", "governance", "crm", "erp", "commerce platform", "search", "recommendation", "recommendations"
          ]
          TOPIC_RULES = [
              ("Retail & Consumer Services", ["retail", "retailer", "consumer", "shopper", "store", "grocery", "commerce", "ecommerce", "e-commerce", "marketplace", "qsr", "hospitality"]),
              ("AI Agents & Automation", ["agent", "agents", "assistant", "autonomous", "workflow", "automation", "copilot"]),
              ("GenAI & Foundation Models", ["generative ai", "genai", "llm", "large language", "foundation model", "model", "chatgpt", "claude", "gemini", "openai", "anthropic", "deepmind"]),
              ("Customer & Loyalty", ["customer", "loyalty", "personalization", "personalisation", "marketing", "experience", "shopper", "recommendation"]),
              ("Store Operations", ["store", "checkout", "pos", "associate", "workforce", "cashier", "queue", "loss prevention", "shrink"]),
              ("Supply Chain & Forecasting", ["inventory", "supply chain", "forecast", "forecasting", "warehouse", "fulfillment", "fulfilment", "demand planning"]),
              ("Pricing & Merchandising", ["pricing", "promotion", "promo", "merchandising", "assortment", "markdown", "demand"]),
              ("Data, Platforms & Cloud", ["data", "platform", "cloud", "api", "infrastructure", "gpu", "nvidia", "microsoft", "azure", "database"]),
              ("Governance, Risk & Responsible AI", ["governance", "risk", "responsible", "safety", "security", "privacy", "regulation", "policy", "eu ai act", "compliance", "copyright"]),
              ("Research & Market Signals", ["research", "paper", "benchmark", "report", "study", "funding", "investment", "startup", "acquisition", "market"]),
          ]
          TOPIC_ORDER = [name for name, _ in TOPIC_RULES] + ["AI Trend"]
          
          SAMPLE_ITEMS = [
              {"source":"OpenAI News", "kind":"official_lab", "title":"New agent capabilities reshape enterprise AI adoption", "url":"https://example.com/openai-agent-capabilities", "summary":"A major AI lab introduced new agent capabilities aimed at automating complex workflows, improving tool use and supporting enterprise deployment.", "published": NOW - dt.timedelta(days=1, hours=2)},
              {"source":"Retail Dive", "kind":"retail", "title":"Retailers test AI for inventory visibility and store operations", "url":"https://example.com/retail-ai-inventory", "summary":"Retailers are exploring AI-driven inventory signals, associate tooling and store operations analytics to improve availability and reduce manual work.", "published": NOW - dt.timedelta(days=2, hours=4)},
              {"source":"VentureBeat AI", "kind":"ai_news", "title":"AI governance becomes board-level issue as adoption scales", "url":"https://example.com/ai-governance", "summary":"As generative AI moves from pilots to production, organizations are investing in stronger governance, evaluation and responsible AI controls.", "published": NOW - dt.timedelta(days=3, hours=1)},
              {"source":"Modern Retail", "kind":"retail", "title":"Brands rethink personalization as consumer data strategies mature", "url":"https://example.com/customer-loyalty-ai", "summary":"Consumer brands and retailers are evaluating how AI can improve personalization, loyalty and digital commerce without losing customer trust.", "published": NOW - dt.timedelta(days=4, hours=3)},
              {"source":"NVIDIA Blog", "kind":"platform", "title":"AI infrastructure demand pushes new approaches to inference efficiency", "url":"https://example.com/inference-efficiency", "summary":"Platform vendors are focusing on more efficient inference, lower latency and scalable infrastructure for enterprise AI workloads.", "published": NOW - dt.timedelta(days=5, hours=5)},
          ]
          
          def strip_html(value: str) -> str:
              if not value:
                  return ""
              value = html.unescape(value)
              value = re.sub(r"<script[\s\S]*?</script>", " ", value, flags=re.I)
              value = re.sub(r"<style[\s\S]*?</style>", " ", value, flags=re.I)
              value = re.sub(r"<[^>]+>", " ", value)
              value = re.sub(r"\s+", " ", value).strip()
              return value
          
          def truncate(value: str, max_len: int = 300) -> str:
              value = strip_html(value)
              if len(value) <= max_len:
                  return value
              cut = value[:max_len].rsplit(" ", 1)[0]
              return cut.rstrip(".,;:") + "…"
          
          def slugify(value: str) -> str:
              value = value.lower().replace("&", " and ")
              value = re.sub(r"[^a-z0-9]+", "-", value)
              return value.strip("-") or "topic"
          
          def parse_date(value: str):
              if not value:
                  return None
              value = value.strip()
              try:
                  parsed = email.utils.parsedate_to_datetime(value)
                  if parsed.tzinfo is None:
                      parsed = parsed.replace(tzinfo=dt.timezone.utc)
                  return parsed.astimezone(TZ)
              except Exception:
                  pass
              try:
                  cleaned = value.replace("Z", "+00:00")
                  parsed = dt.datetime.fromisoformat(cleaned)
                  if parsed.tzinfo is None:
                      parsed = parsed.replace(tzinfo=dt.timezone.utc)
                  return parsed.astimezone(TZ)
              except Exception:
                  return None
          
          def local_name(tag: str) -> str:
              return tag.split("}", 1)[-1].lower()
          
          def child_text(elem, *names):
              wanted = {n.lower() for n in names}
              for child in list(elem):
                  if local_name(child.tag) in wanted and child.text:
                      return child.text.strip()
              return ""
          
          def find_link(elem, is_atom=False):
              if is_atom:
                  for child in list(elem):
                      if local_name(child.tag) == "link":
                          href = child.attrib.get("href", "")
                          rel = child.attrib.get("rel", "alternate")
                          if href and rel in ("alternate", ""):
                              return href.strip()
                  return ""
              link = child_text(elem, "link")
              if link:
                  return link.strip()
              guid = child_text(elem, "guid")
              return guid.strip() if guid.startswith("http") else ""
          
          def fetch_feed(source):
              req = urllib.request.Request(
                  source["url"],
                  headers={
                      "User-Agent": "Mozilla/5.0 (compatible; CGI-AI-Retail-Weekstream/4.0; +https://github.com/)",
                      "Accept": "application/rss+xml, application/atom+xml, application/xml, text/xml, */*",
                  },
              )
              with urllib.request.urlopen(req, timeout=22) as response:
                  return response.read()
          
          def parse_feed(xml_bytes, source):
              root = ET.fromstring(xml_bytes)
              items = []
              for elem in root.iter():
                  lname = local_name(elem.tag)
                  if lname not in ("item", "entry"):
                      continue
                  is_atom = lname == "entry"
                  title = child_text(elem, "title")
                  link = find_link(elem, is_atom=is_atom)
                  summary = child_text(elem, "description", "summary", "content", "encoded")
                  date_raw = child_text(elem, "pubdate", "published", "updated", "date")
                  items.append({
                      "source": source["name"],
                      "kind": source["kind"],
                      "title": strip_html(title),
                      "url": link,
                      "summary": truncate(summary, 520),
                      "published": parse_date(date_raw),
                  })
              return [item for item in items if item.get("title") and item.get("url")]
          
          def count_terms(text, terms):
              text_l = f" {text.lower()} "
              return sum(1 for term in terms if term.lower() in text_l)
          
          def classify_topics(text, kind):
              topics = []
              text_l = text.lower()
              for topic, terms in TOPIC_RULES:
                  if any(term.lower() in text_l for term in terms):
                      topics.append(topic)
              if kind == "retail" and "Retail & Consumer Services" not in topics:
                  topics.insert(0, "Retail & Consumer Services")
              if not topics:
                  topics.append("AI Trend")
              return [topic for topic in TOPIC_ORDER if topic in topics][:5]
          
          def cgi_angle(article):
              topics = set(article["topics"])
              if "Retail & Consumer Services" in topics:
                  if "Supply Chain & Forecasting" in topics:
                      return "Relevant voor CGI Retail & Consumer Services omdat dit raakt aan beschikbaarheid, demand planning en operationele betrouwbaarheid bij retailklanten. Dit artikel is bruikbaar voor gesprekken over datakwaliteit, forecasting, integratie met bestaande platformen en schaalbare AI-delivery."
                  if "Customer & Loyalty" in topics:
                      return "Relevant voor CGI Retail & Consumer Services omdat AI hier direct raakt aan klantbeleving, personalisatie, loyalty en omnichannel data. Dit kan helpen in klantgesprekken over waardecreatie, consent, meetbaarheid en verantwoord gebruik van klantinzichten."
                  if "Pricing & Merchandising" in topics:
                      return "Relevant voor CGI Retail & Consumer Services omdat commerciële besluitvorming steeds vaker AI-ondersteund wordt. Interessant voor proposities rond pricing, promoties, assortiment, scenarioanalyse en aansluiting op commerce-, ERP- en data-platformen."
                  if "Store Operations" in topics:
                      return "Relevant voor CGI Retail & Consumer Services omdat AI in winkeloperaties kan bijdragen aan productiviteit, servicekwaliteit en betere ondersteuning van medewerkers. Dit raakt aan procesontwerp, integratie, adoptie en change management."
                  return "Relevant voor CGI Retail & Consumer Services omdat dit laat zien hoe AI, data en digitale platformen de retail- en consumer-servicesketen veranderen. Goed bruikbaar als signaal voor klantgesprekken over roadmap, prioriteiten, governance en implementatie."
              if "Governance, Risk & Responsible AI" in topics:
                  return "Goed om te volgen voor CGI omdat governance, security en responsible AI randvoorwaarden zijn voor productiegebruik bij klanten. Dit helpt in gesprekken over risico's, beleid, controles, compliance en beheersbare AI-adoptie."
              if "AI Agents & Automation" in topics:
                  return "Interessant voor CGI omdat agents en workflowautomatisering invloed hebben op toekomstige klantprocessen, deliverymodellen en medewerkerproductiviteit. Voor Retail & Consumer Services is dit vooral relevant in processen met veel handmatige stappen en uitzonderingen."
              if "Data, Platforms & Cloud" in topics:
                  return "Relevant voor CGI omdat platformkeuzes, cloudkosten, datavolwassenheid en integratie bepalen of AI schaalbaar wordt. Voor klanten is dit bruikbaar bij roadmapgesprekken over architectuur, vendorselectie en de stap van experiment naar productie."
              if "GenAI & Foundation Models" in topics:
                  return "Goed om te weten voor CGI Retail & Consumer Services omdat model- en toolingontwikkelingen snel doorwerken in klantverwachtingen, vendor-roadmaps en mogelijke use-cases. Het helpt advies en proof-of-value trajecten actueel te houden."
              return "Goed om te volgen als AI-marktsignaal voor CGI Retail & Consumer Services. Het artikel helpt om klantvragen, proposities en interne kennisontwikkeling actueel te houden, ook als de ontwikkeling niet direct een retail-use-case is."
          
          def normalize_key(article):
              base = article.get("url") or article.get("title", "")
              base = re.sub(r"[?#].*$", "", base.lower()).strip()
              if not base:
                  base = re.sub(r"[^a-z0-9]+", " ", article.get("title", "").lower()).strip()
              return hashlib.sha1(base.encode("utf-8")).hexdigest()
          
          raw_items = []
          fetch_errors = []
          if os.environ.get("DEMO_MODE") == "1":
              raw_items = SAMPLE_ITEMS[:]
          else:
              for source in SOURCES:
                  try:
                      raw_items.extend(parse_feed(fetch_feed(source), source))
                  except Exception as exc:
                      fetch_errors.append({"source": source["name"], "error": str(exc)[:220]})
          
          dedup = {}
          for item in raw_items:
              published = item.get("published") or NOW
              if published < CUTOFF or published > NOW + dt.timedelta(days=1):
                  continue
              text = " ".join([item.get("title", ""), item.get("summary", ""), item.get("source", "")])
              ai_score = count_terms(text, AI_TERMS)
              retail_score = count_terms(text, RETAIL_TERMS)
              tech_score = count_terms(text, TECH_TERMS)
              include = False
              if item.get("kind") in ("ai_news", "official_lab", "research", "platform") and ai_score > 0:
                  include = True
              if item.get("kind") == "retail" and (ai_score > 0 or tech_score > 0 or retail_score >= 2):
                  include = True
              if not include:
                  continue
              topics = classify_topics(text, item.get("kind", ""))
              recency_score = max(0, 7 - (NOW - published).days)
              relevance = ai_score * 3 + retail_score * 2 + tech_score + recency_score
              if item.get("kind") == "retail":
                  relevance += 4
              if "Retail & Consumer Services" in topics:
                  relevance += 3
              article = {
                  "source": item.get("source", "Unknown source"),
                  "kind": item.get("kind", ""),
                  "title": item.get("title", "Untitled"),
                  "url": item.get("url", "#"),
                  "summary": truncate(item.get("summary") or item.get("title", ""), 300),
                  "published": published,
                  "date_label": published.strftime("%d %b %Y"),
                  "topics": topics,
                  "topic_slugs": [slugify(t) for t in topics],
                  "primary_topic": topics[0],
                  "primary_slug": slugify(topics[0]),
                  "relevance": relevance,
                  "is_retail": "Retail & Consumer Services" in topics or item.get("kind") == "retail",
              }
              article["cgi_angle"] = cgi_angle(article)
              key = normalize_key(article)
              if key not in dedup or article["relevance"] > dedup[key]["relevance"]:
                  dedup[key] = article
          
          articles = list(dedup.values())
          articles.sort(key=lambda a: (a["relevance"], a["published"]), reverse=True)
          articles = articles[:120]
          
          topic_counts = {topic: 0 for topic in TOPIC_ORDER}
          for article in articles:
              for topic in article["topics"]:
                  topic_counts[topic] = topic_counts.get(topic, 0) + 1
          filter_topics = [(topic, slugify(topic), topic_counts.get(topic, 0)) for topic in TOPIC_ORDER if topic_counts.get(topic, 0) > 0]
          
          def h(value):
              return html.escape(str(value or ""), quote=True)
          
          def visual_card(article):
              label = article["primary_topic"]
              source = article["source"]
              slug = article["primary_slug"]
              icon = {
                  "retail-and-consumer-services": "RCS",
                  "ai-agents-and-automation": "AGENT",
                  "genai-and-foundation-models": "GenAI",
                  "customer-and-loyalty": "CX",
                  "store-operations": "STORE",
                  "supply-chain-and-forecasting": "SUPPLY",
                  "pricing-and-merchandising": "PRICE",
                  "data-platforms-and-cloud": "DATA",
                  "governance-risk-and-responsible-ai": "TRUST",
                  "research-and-market-signals": "SIGNAL",
              }.get(slug, "AI")
              return f'''
              <div class="visual visual-{h(slug)}" aria-label="{h(label)} visual">
                <div class="visual-grid"></div>
                <div class="visual-orbit"></div>
                <div class="visual-bars"><i></i><i></i><i></i></div>
                <div class="visual-content">
                  <span class="visual-kicker">{h(source)}</span>
                  <strong>{h(icon)}</strong>
                  <span>{h(label)}</span>
                </div>
              </div>'''
          
          def article_card(article, highlight=False):
              topics_html = "".join([f'<span class="tag" data-tag="{h(slugify(t))}">{h(t)}</span>' for t in article["topics"]])
              classes = "article-card highlight-card" if highlight else "article-card"
              return f'''
              <article class="{classes}" data-topics="{' '.join(h(s) for s in article['topic_slugs'])}" data-title="{h(article['title'].lower())}">
                {visual_card(article)}
                <div class="card-body">
                  <div class="meta"><span>{h(article['source'])}</span><span>{h(article['date_label'])}</span><span>{h(article['primary_topic'])}</span></div>
                  <h3>{h(article['title'])}</h3>
                  <p class="summary">{h(article['summary'])}</p>
                  <div class="cgi-angle"><strong>CGI Angle:</strong> {h(article['cgi_angle'])}</div>
                  <div class="tags" aria-label="Tags">{topics_html}</div>
                  <a class="source-button" href="{h(article['url'])}" target="_blank" rel="noopener noreferrer">Lees bronartikel <span>→</span></a>
                </div>
              </article>'''
          
          def topic_overview():
              if not articles:
                  return "Er zijn deze week geen relevante artikelen opgehaald uit de ingestelde bronnen. Controleer de workflow-run logs als dit onverwacht is."
              top_topics = sorted(topic_counts.items(), key=lambda kv: kv[1], reverse=True)[:4]
              top_topics = [topic for topic, count in top_topics if count > 0]
              if len(top_topics) > 1:
                  topic_sentence = ", ".join(top_topics[:-1]) + " en " + top_topics[-1]
              elif top_topics:
                  topic_sentence = top_topics[0]
              else:
                  topic_sentence = "AI"
              retail_count = sum(1 for a in articles if a["is_retail"])
              return (
                  f"Afgelopen week draaide de AI-nieuwsstroom vooral om {topic_sentence}. "
                  f"Voor CGI Retail & Consumer Services zijn vooral signalen rond klantdata, operations, platformkeuzes, governance en schaalbare AI-adoptie relevant. "
                  f"Deze week bevat de stream {len(articles)} relevante artikelen; daarvan hebben {retail_count} artikelen een duidelijke Retail & Consumer Services-link."
              )
          
          filters_html = '<button class="filter-button active" data-filter="all" type="button">Alle artikelen</button>'
          for topic, slug, count in filter_topics:
              filters_html += f'<button class="filter-button" data-filter="{h(slug)}" type="button">{h(topic)} <span>{count}</span></button>'
          
          highlights = articles[:6]
          retail_articles = [a for a in articles if a["is_retail"]][:40]
          cards_html = "\n".join(article_card(article) for article in articles)
          highlights_html = "\n".join(article_card(article, highlight=True) for article in highlights)
          retail_html = "\n".join(article_card(article) for article in retail_articles)
          if not cards_html:
              cards_html = '''<div class="empty-state"><h3>Geen relevante artikelen gevonden</h3><p>Er zijn deze run geen artikelen binnen de afgelopen 7 dagen opgehaald die door de filters kwamen. Bekijk de workflow logs om te zien of RSS-bronnen tijdelijk niet bereikbaar waren.</p></div>'''
          if not highlights_html:
              highlights_html = cards_html
          if not retail_html:
              retail_html = '<div class="empty-state"><h3>Geen aparte Retail & Consumer Services-items</h3><p>Er zijn deze week geen extra retailgerichte artikelen gevonden binnen de ingestelde bronnen.</p></div>'
          
          errors_html = ""
          if fetch_errors:
              error_items = "".join(f"<li>{h(e['source'])}: {h(e['error'])}</li>" for e in fetch_errors[:12])
              errors_html = f'''<details class="fetch-errors"><summary>Technische feedstatus bekijken</summary><p>Sommige feeds waren tijdelijk niet bereikbaar of gaven geen geldige RSS terug. De briefing is gegenereerd met de artikelen die wel beschikbaar waren.</p><ul>{error_items}</ul></details>'''
          
          html_doc = f'''<!doctype html>
          <html lang="nl">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>CGI AI & Retail Weekstream</title>
            <meta name="description" content="Wekelijkse AI- en Retail & Consumer Services-briefing voor CGI.">
            <style>
              :root {{ --cgi-red:#e31937; --cgi-purple:#5236ab; --cgi-black:#000; --cgi-white:#fff; --surface:#f6f5f7; --card:#fff; --muted:#64606a; --line:#e7e3eb; --shadow:0 24px 70px rgba(0,0,0,.12); --radius:24px; }}
              * {{ box-sizing:border-box; }} html {{ scroll-behavior:smooth; }}
              body {{ margin:0; font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:var(--cgi-black); background:radial-gradient(circle at top left, rgba(227,25,55,.10), transparent 28rem), var(--surface); line-height:1.55; }}
              body.locked {{ overflow:hidden; }} body.locked .page {{ filter: blur(12px); pointer-events:none; user-select:none; }}
              a {{ color:inherit; }} .page {{ max-width:1220px; margin:0 auto; padding:24px; }}
