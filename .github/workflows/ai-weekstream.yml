              .filter-button:hover {{ transform:translateY(-1px); border-color:rgba(227,25,55,.4); }} .filter-button.active {{ background:var(--cgi-red); border-color:var(--cgi-red); color:#fff; }} .filter-button span {{ opacity:.75; margin-left:4px; }} .visible-counter {{ margin-left:auto; color:var(--muted); font-size:.95rem; padding:0 8px; font-weight:800; }}
              .grid {{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:22px; }} .grid.highlights {{ grid-template-columns:repeat(2,minmax(0,1fr)); }}
              .article-card {{ display:flex; flex-direction:column; min-width:0; background:#fff; border:1px solid var(--line); border-radius:28px; overflow:hidden; box-shadow:0 16px 38px rgba(0,0,0,.07); transition:transform .18s ease,box-shadow .18s ease; }} .article-card:hover {{ transform:translateY(-3px); box-shadow:0 22px 56px rgba(0,0,0,.11); }} .article-card[hidden] {{ display:none!important; }}
              .visual {{ position:relative; overflow:hidden; aspect-ratio:16/9; min-height:170px; width:100%; background:linear-gradient(135deg,#e31937,#5236ab); color:white; }}
              .visual::before {{ content:""; position:absolute; inset:0; background:radial-gradient(circle at 18% 16%, rgba(255,255,255,.45), transparent 18%), radial-gradient(circle at 88% 78%, rgba(255,255,255,.26), transparent 24%); }}
              .visual-grid {{ position:absolute; inset:0; background-image:linear-gradient(rgba(255,255,255,.14) 1px, transparent 1px),linear-gradient(90deg, rgba(255,255,255,.14) 1px, transparent 1px); background-size:34px 34px; mask-image:linear-gradient(135deg, black, transparent 72%); }}
              .visual-orbit {{ position:absolute; right:-12%; bottom:-40%; width:62%; aspect-ratio:1; border:1px solid rgba(255,255,255,.34); border-radius:50%; box-shadow:0 0 0 24px rgba(255,255,255,.08),0 0 0 58px rgba(255,255,255,.05); }}
              .visual-bars {{ position:absolute; left:22px; top:22px; display:flex; gap:7px; }} .visual-bars i {{ display:block; width:8px; height:36px; border-radius:99px; background:rgba(255,255,255,.55); }} .visual-bars i:nth-child(2) {{ height:54px; }} .visual-bars i:nth-child(3) {{ height:24px; }}
              .visual-content {{ position:absolute; inset:0; display:flex; flex-direction:column; justify-content:flex-end; gap:6px; padding:22px; }} .visual-kicker {{ font-size:.78rem; text-transform:uppercase; letter-spacing:.08em; opacity:.9; font-weight:900; }} .visual strong {{ font-size:clamp(2.1rem,7vw,4rem); line-height:.85; letter-spacing:-.06em; }} .visual-content>span:last-child {{ font-size:.95rem; font-weight:900; opacity:.94; }}
              .visual-retail-and-consumer-services {{ background:linear-gradient(135deg,#e31937,#991f3d); }} .visual-ai-agents-and-automation {{ background:linear-gradient(135deg,#5236ab,#1c1720); }} .visual-genai-and-foundation-models {{ background:linear-gradient(135deg,#e31937,#a82465,#5236ab); }} .visual-customer-and-loyalty {{ background:linear-gradient(135deg,#991f3d,#e31937); }} .visual-store-operations {{ background:linear-gradient(135deg,#1c1720,#5236ab); }} .visual-supply-chain-and-forecasting {{ background:linear-gradient(135deg,#5236ab,#2f245e); }} .visual-pricing-and-merchandising {{ background:linear-gradient(135deg,#e31937,#ff6a00); }} .visual-data-platforms-and-cloud {{ background:linear-gradient(135deg,#000,#5236ab); }} .visual-governance-risk-and-responsible-ai {{ background:linear-gradient(135deg,#000,#991f3d); }} .visual-research-and-market-signals {{ background:linear-gradient(135deg,#5236ab,#a82465); }}
              .card-body {{ display:flex; flex-direction:column; gap:13px; padding:20px; flex:1; }} .meta {{ display:flex; gap:8px; flex-wrap:wrap; color:var(--muted); font-size:.79rem; font-weight:850; text-transform:uppercase; letter-spacing:.045em; }} .meta span:not(:last-child)::after {{ content:"•"; margin-left:8px; color:#b8b1bf; }} .article-card h3 {{ margin:0; font-size:1.12rem; line-height:1.22; letter-spacing:-.02em; }} .summary {{ margin:0; color:#39343f; }} .cgi-angle {{ background:#faf7f9; border-left:4px solid var(--cgi-red); border-radius:14px; padding:12px 13px; color:#28222d; font-size:.94rem; }}
              .tags {{ display:flex; flex-wrap:wrap; gap:8px; margin-top:auto; }} .tag {{ background:#f1eef4; color:#31263a; border:1px solid #e4deeb; border-radius:999px; padding:6px 9px; font-size:.78rem; font-weight:900; }}
              .source-button {{ display:inline-flex; justify-content:center; align-items:center; gap:8px; width:max-content; max-width:100%; margin-top:2px; padding:12px 16px; border-radius:999px; background:var(--cgi-red); color:#fff; text-decoration:none; font-weight:950; box-shadow:0 12px 28px rgba(227,25,55,.24); }} .source-button:hover {{ transform:translateY(-1px); box-shadow:0 16px 34px rgba(227,25,55,.3); }}
              .empty-state,.fetch-errors {{ background:#fff; border:1px dashed #cfc7d8; border-radius:22px; padding:22px; color:var(--muted); }} .fetch-errors summary {{ cursor:pointer; font-weight:900; color:#201827; }}
              footer {{ margin:38px 0 18px; color:var(--muted); text-align:center; font-size:.9rem; }}
              @media (max-width:960px) {{ .grid,.grid.highlights {{ grid-template-columns:1fr; }} .section-title {{ align-items:flex-start; flex-direction:column; }} .filters {{ position:relative; top:auto; border-radius:20px; }} .filter-button {{ flex:1 1 100%; text-align:left; }} .visible-counter {{ margin-left:0; width:100%; }} .nav-row {{ flex-direction:column; }} .issue-meta {{ text-align:left; }} .hero h1 {{ margin-top:34px; }} .page {{ padding:14px; }} }}
            </style>
          </head>
          <body class="locked">
            <div class="login-gate" role="dialog" aria-modal="true" aria-labelledby="login-title">
              <div class="login-card">
                <div class="login-logo">CGI</div>
                <h1 id="login-title">Toegang tot de AI Weekstream</h1>
                <p>Voer de toegangscode in om de briefing voor CGI Retail & Consumer Services te openen.</p>
                <form class="login-form" id="loginForm">
                  <input id="accessCode" type="password" autocomplete="current-password" placeholder="Toegangscode" aria-label="Toegangscode" autofocus>
                  <button type="submit">Open briefing</button>
                </form>
                <p class="login-error" id="loginError"></p>
                <p class="login-note">Let op: dit is een lichte statische toegangsdrempel voor GitHub Pages, geen enterprise-authenticatie.</p>
              </div>
            </div>
            <main class="page">
              <header class="hero">
                <div class="nav-row">
                  <div class="logo">CGI</div>
                  <div class="issue-meta">
                    <div>Vrijdagupdate · laatste 7 dagen</div>
                    <div>{h(NOW.strftime('%d %B %Y · %H:%M'))} Europe/Amsterdam</div>
                    <span class="version-badge">{h(VERSION)}</span>
                  </div>
                </div>
                <h1>AI Weekstream voor Retail & Consumer Services</h1>
                <p>Een wekelijkse selectie van relevante AI-ontwikkelingen voor CGI Retail & Consumer Services, met per artikel een praktische CGI Angle.</p>
                <div class="metric-pill"><span>{len(articles)}</span><span>relevante artikelen</span></div>
              </header>
          
              <section class="section panel">
                <div class="section-title"><h2>Weeksamenvatting</h2><p>Wat speelde er deze week?</p></div>
                <p class="week-summary">{h(topic_overview())}</p>
              </section>
          
              <section class="section">
                <div class="section-title"><h2>Filter op topic</h2><p>Klik op een topic of gebruik de tags op een kaart.</p></div>
                <div class="filters" aria-label="Themafilters">
                  {filters_html}
                  <span class="visible-counter" id="visibleCounter">{len(articles)} zichtbaar</span>
                </div>
              </section>
          
              <section class="section">
                <div class="section-title"><h2>Topselectie deze week</h2><p>De belangrijkste signalen bovenaan.</p></div>
                <div class="grid highlights">{highlights_html}</div>
              </section>
          
              <section class="section">
                <div class="section-title"><h2>Alle relevante AI-artikelen</h2><p>Gefilterd op AI-, retail- en CGI-relevantie.</p></div>
                <div class="grid all-articles" id="articlesGrid">{cards_html}</div>
              </section>
          
              <section class="section">
                <div class="section-title"><h2>Retail & Consumer Services: relevante artikelen</h2><p>Specifiek relevant voor retail, commerce, consumenten, winkels en operatie.</p></div>
                <div class="grid retail-articles">{retail_html}</div>
              </section>
          
              {errors_html}
              <footer>CGI AI & Retail Weekstream · {h(VERSION)} · root en latest zijn beide gepubliceerd · gegenereerd op {h(NOW.isoformat())}</footer>
            </main>
            <script>
              const ACCESS_HASH = '{ACCESS_CODE_HASH}';
              async function sha256Hex(text) {{
                const enc = new TextEncoder().encode(text);
                const buf = await crypto.subtle.digest('SHA-256', enc);
                return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
              }}
              function unlock() {{ document.body.classList.remove('locked'); sessionStorage.setItem('cgi_weekstream_unlocked', '1'); }}
              if (sessionStorage.getItem('cgi_weekstream_unlocked') === '1') unlock();
              document.getElementById('loginForm').addEventListener('submit', async (event) => {{
                event.preventDefault();
                const input = document.getElementById('accessCode');
                const error = document.getElementById('loginError');
                const hash = await sha256Hex(input.value || '');
                if (hash === ACCESS_HASH) unlock();
                else {{ error.textContent = 'Code klopt niet. Controleer hoofdletters en leestekens.'; input.select(); }}
              }});
          
              const buttons = Array.from(document.querySelectorAll('.filter-button'));
              const cards = Array.from(document.querySelectorAll('.article-card'));
              const counter = document.getElementById('visibleCounter');
              function setFilter(filter) {{
                let visible = 0;
                cards.forEach(card => {{
                  const topics = (card.dataset.topics || '').split(/\s+/);
                  const show = filter === 'all' || topics.includes(filter);
                  card.hidden = !show;
                  if (show) visible += 1;
                }});
                buttons.forEach(btn => btn.classList.toggle('active', btn.dataset.filter === filter));
                if (counter) counter.textContent = visible + ' zichtbaar';
                if (filter === 'all') history.replaceState(null, '', location.pathname);
                else history.replaceState(null, '', '#' + filter);
              }}
              buttons.forEach(btn => btn.addEventListener('click', () => setFilter(btn.dataset.filter)));
              document.querySelectorAll('.tag').forEach(tag => tag.addEventListener('click', () => setFilter(tag.dataset.tag)));
              const initial = location.hash.replace('#', '');
              if (buttons.some(btn => btn.dataset.filter === initial)) setFilter(initial);
            </script>
          </body>
          </html>'''
          
          for target in (LATEST / "index.html", ARCHIVE / "index.html", SITE / "index.html"):
              target.write_text(html_doc, encoding="utf-8")
          status = {
              "version": VERSION,
              "generated_at": NOW.isoformat(),
              "week_id": WEEK_ID,
              "article_count": len(articles),
              "retail_article_count": sum(1 for a in articles if a["is_retail"]),
              "topics": topic_counts,
              "fetch_errors": fetch_errors,
              "sources": [s["name"] for s in SOURCES],
              "features": ["login gate", "topic filters", "clickable tags", "CGI Angle", "responsive CSS visuals", "source button", "latest URL"],
          }
          for target in (LATEST / "status.json", ARCHIVE / "status.json", SITE / "status.json"):
              target.write_text(json.dumps(status, ensure_ascii=False, indent=2, default=str), encoding="utf-8")
          check_text = f"{VERSION}\nGenerated: {NOW.isoformat()}\nArticle count: {len(articles)}\nRoot, latest and archive were written in this workflow.\n"
          for target in (LATEST / "DEPLOYMENT_CHECK.txt", ARCHIVE / "DEPLOYMENT_CHECK.txt", SITE / "DEPLOYMENT_CHECK.txt"):
              target.write_text(check_text, encoding="utf-8")
          PY

      - name: Configureer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Publiceer naar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Bewaar gegenereerde output als artifact
        uses: actions/upload-artifact@v4
        with:
          name: cgi-ai-retail-weekstream
          path: site/**
