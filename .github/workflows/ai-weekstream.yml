              .section {{ margin-top:34px; }} .panel {{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:clamp(20px,3vw,32px); box-shadow:0 18px 44px rgba(0,0,0,.06); }}
              .section-title {{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:18px; }} .section-title h2 {{ margin:0; font-size:clamp(1.55rem,2.4vw,2.25rem); letter-spacing:-.035em; }} .section-title p {{ margin:0; color:var(--muted); }} .week-summary {{ font-size:1.08rem; max-width:960px; margin:0; }}
              .filters {{ position:sticky; top:10px; z-index:10; display:flex; gap:10px; flex-wrap:wrap; align-items:center; padding:14px; border-radius:24px; background:rgba(255,255,255,.9); border:1px solid var(--line); box-shadow:0 18px 40px rgba(0,0,0,.08); backdrop-filter:blur(12px); }}
